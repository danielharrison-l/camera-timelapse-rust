[package]
name = "camera-timelapse-rust"
version = "0.1.0"
edition = "2021"
authors = ["Daniel Harrison <daniel@vision360.app.br>"]
description = "Microserviço event-driven de alta performance em Rust para geração de vídeos Timelapse via SFTP, SQS (Inbound/Outbound) e S3"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
ssh2 = "0.9"
aws-config = { version = "1.5", features = ["behavior-version-latest"] }
aws-sdk-sqs = "1.50"
aws-sdk-s3 = "1.70"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
anyhow = "1.0"
